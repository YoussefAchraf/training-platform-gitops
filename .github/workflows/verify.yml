name: Verify

on:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@v5.0.1
        with:
          version: v3.16.4

      - name: helm dependency update (every wrapper chart)
        run: |
          set -e
          for c in charts/*/; do
            if [ -f "$c/Chart.yaml" ] && grep -q '^dependencies:' "$c/Chart.yaml"; then
              helm dependency update "$c"
            fi
          done

      - name: helm lint (every chart)
        run: |
          set -e
          for c in charts/*/; do
            if [ -f "$c/Chart.yaml" ]; then
              echo "::group::helm lint $c"
              helm lint "$c"
              echo "::endgroup::"
            fi
          done

      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz \
            | tar xz kubeconform
          sudo mv kubeconform /usr/local/bin/

      - name: helm template | kubeconform -strict (first-party charts, every environment)
        run: |
          set -e
          for env in environments/*/; do
            envname=$(basename "$env")
            for c in postgres backend frontend chatbot; do
              valuesfile="$env$c-values.yaml"
              [ -f "$valuesfile" ] || continue
              echo "::group::kubeconform $envname/$c"
              helm template "charts/$c" -f "$valuesfile" \
                | kubeconform -strict -summary \
                    -schema-location default \
                    -kubernetes-version 1.29.0 \
                    -skip Route,ServiceMonitor
              echo "::endgroup::"
            done
          done

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  sast:
    name: sast
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Semgrep scan (community rules incl. Kubernetes/YAML, report only for now)
        run: |
          docker run --rm -v "${{ github.workspace }}:/src" semgrep/semgrep \
            semgrep scan --config=auto /src || true

  k8s-sast:
    name: k8s-sast
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@v5.0.1
        with:
          version: v3.16.4

      - name: helm dependency update (every wrapper chart)
        run: |
          set -e
          for c in charts/*/; do
            if [ -f "$c/Chart.yaml" ] && grep -q '^dependencies:' "$c/Chart.yaml"; then
              helm dependency update "$c"
            fi
          done

      - name: Render every chart to a single manifest set
        run: |
          set -e
          mkdir -p /tmp/rendered
          for c in charts/*/; do
            name=$(basename "$c")
            if [ ! -f "$c/Chart.yaml" ]; then
              cat "$c"/*.yaml > "/tmp/rendered/${name}.yaml"
              continue
            fi
            rendered_any=false
            for env in environments/*/; do
              envname=$(basename "$env")
              valuesfile="$env${name}-values.yaml"
              [ -f "$valuesfile" ] || continue
              helm template "$c" -f "$valuesfile" > "/tmp/rendered/${envname}-${name}.yaml"
              rendered_any=true
            done
            if [ "$rendered_any" = false ]; then
              helm template "$c" > "/tmp/rendered/${name}.yaml"
            fi
          done

      - name: kube-linter
        continue-on-error: true
        uses: stackrox/kube-linter-action@v1.0.7
        with:
          directory: /tmp/rendered

      - name: checkov
        uses: bridgecrewio/checkov-action@v12.3122.0
        with:
          directory: /tmp/rendered
          framework: kubernetes
          soft_fail: true

  policy:
    name: policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@v5.0.1
        with:
          version: v3.16.4

      - name: Render first-party charts (policy applies to charts this repo owns, not upstream vault/monitoring internals)
        run: |
          set -e
          mkdir -p /tmp/rendered
          for env in environments/*/; do
            envname=$(basename "$env")
            for c in postgres backend frontend chatbot; do
              valuesfile="$env$c-values.yaml"
              [ -f "$valuesfile" ] || continue
              helm template "charts/$c" -f "$valuesfile" > "/tmp/rendered/${envname}-${c}.yaml"
            done
          done

      - name: Install conftest
        run: |
          curl -sSL https://github.com/open-policy-agent/conftest/releases/download/v0.69.0/conftest_0.69.0_Linux_x86_64.tar.gz \
            | tar xz conftest
          sudo mv conftest /usr/local/bin/

      - name: conftest test (this repo's own security policies)
        run: conftest test --policy policy /tmp/rendered/*.yaml

  sca:
    name: sca
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Trivy — postgres:16-alpine
        uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: true
        with:
          image-ref: postgres:16-alpine
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
          skip-files: /usr/local/bin/gosu

      - name: Trivy — redis:7-alpine
        uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: true
        with:
          image-ref: redis:7-alpine
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
