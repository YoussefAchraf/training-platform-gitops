name: CodeQL

# Mirrors training-platform-backend/-frontend's own codeql.yml exactly —
# same trigger shape, same matrix pattern (actions + javascript-typescript).
# javascript-typescript here only ever analyzes scripts/*.js (see
# .github/codeql/codeql-config.yml) since that's the only application code
# in this repo.
on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript]
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          config-file: ./.github/codeql/codeql-config.yml

      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}
