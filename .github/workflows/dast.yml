name: DAST

on:
  workflow_call:

permissions:
  contents: read

jobs:
  live-cluster-validation:
    name: live-cluster-validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: helm/kind-action@v1

      - uses: azure/setup-helm@v5.0.1
        with:
          version: v3.16.4

      - name: Create namespace under Pod Security Admission "restricted"
        run: |
          kubectl create namespace training-platform
          kubectl label namespace training-platform \
            pod-security.kubernetes.io/enforce=restricted \
            pod-security.kubernetes.io/enforce-version=latest

      - name: Create CI-only dummy postgres secret (not a real credential)
        run: |
          kubectl create secret generic postgres-credentials \
            --namespace training-platform \
            --from-literal=postgres-password="ci-only-$(openssl rand -hex 8)"

      - name: helm install postgres
        run: |
          helm install postgres charts/postgres \
            --namespace training-platform \
            --set persistence.storageClassName=standard \
            --set securityContext.runAsUser=1000710000 \
            --wait --timeout 3m

      - name: Confirm the pod is actually Ready under restricted PSA
        run: |
          kubectl get pods -n training-platform -o wide
          kubectl wait --for=condition=Ready pod -l app.kubernetes.io/name=postgres \
            -n training-platform --timeout=60s

      - name: Install kubescape CLI (report-only for now)
        run: (curl -s https://raw.githubusercontent.com/kubescape/kubescape/master/install.sh | /bin/bash) || true

      - name: kubescape scan framework nsa (live cluster, report-only for now)
        run: command -v kubescape >/dev/null && kubescape scan framework nsa --format-version v2 || true
