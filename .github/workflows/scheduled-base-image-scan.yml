name: Scheduled base-image scan

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  scan:
    name: scan
    runs-on: ubuntu-latest
    steps:
      - name: Trivy — postgres:16-alpine
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: postgres:16-alpine
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
          skip-files: /usr/local/bin/gosu

      - name: Trivy — redis:7-alpine
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: redis:7-alpine
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
