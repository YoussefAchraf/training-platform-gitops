name: On feature branch push

on:
  push:
    branches:
      - "feature/**"

jobs:
  verify:
    uses: ./.github/workflows/verify.yml
    secrets: inherit

  open-pr-to-dev:
    name: open-pr-to-dev
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BRANCH: ${{ github.ref_name }}
      COMMIT_MSG: ${{ github.event.head_commit.message }}
    steps:
      - name: Open (or reuse) a PR into dev
        run: |
          EXISTING=$(gh pr list --repo "${{ github.repository }}" --head "$BRANCH" --base dev --json number --jq 'length')
          if [ "$EXISTING" = "0" ]; then
            TITLE=$(printf '%s' "$COMMIT_MSG" | head -n1)
            gh pr create --repo "${{ github.repository }}" --base dev --head "$BRANCH" \
              --title "$TITLE" \
              --body "Auto-opened after verify passed on \`$BRANCH\`. Review and merge manually."
          fi
