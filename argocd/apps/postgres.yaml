# No Vault dependency (postgres always uses its own plain bootstrap
# Secret — no Vault role defined for the datastore itself, only for
# backend/chatbot which consume it). Default sync-wave (0) is fine; it
# doesn't need to wait for vault.yaml's wave -1.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: postgres
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/YoussefAchraf/training-platform-gitops.git
    targetRevision: main
    path: charts/postgres
    helm:
      valueFiles:
        - ../../environments/local-okd/postgres-values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: training-platform
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
