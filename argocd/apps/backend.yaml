apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: backend
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://github.com/YoussefAchraf/training-platform-gitops.git
    targetRevision: main
    path: charts/backend
    helm:
      valueFiles:
        - ../../environments/local-okd/backend-values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: training-platform
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      # Prune the old Deployment only after the new Rollout is Healthy, so the
      # Deployment -> Rollout conversion never leaves the backend Service without a pod.
      - PruneLast=true
      # Replicas are owned by KEDA (charts/keda-schedules): apply Git without
      # touching them, not just ignore them when diffing.
      - RespectIgnoreDifferences=true
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
    - group: apps
      kind: StatefulSet
      jsonPointers:
        - /spec/replicas
    - group: argoproj.io
      kind: Rollout
      jsonPointers:
        - /spec/replicas
    # The Rollout controller owns the selector of the active and preview Services
    # (it adds rollouts-pod-template-hash); Git must not revert it. Only these two:
    # the backend-redis Service keeps being diffed normally.
    - kind: Service
      name: backend
      jsonPointers:
        - /spec/selector
    - kind: Service
      name: backend-preview
      jsonPointers:
        - /spec/selector
