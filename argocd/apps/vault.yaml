# Vault is now a hard prerequisite for backend and chatbot — both charts
# ship with vault.enabled: true by default (all their secrets are
# Vault-delivered, no plain-Secret fallback in normal operation). The
# sync-wave below makes ArgoCD apply and wait for Vault to be Healthy
# BEFORE it even attempts backend/chatbot (wave 0), rather than relying on
# a human following the runbook's ordering by hand. Still requires a
# one-time manual step after Vault's pod is up: enable the Kubernetes auth
# method and create backend-role/n8n-role (see docs/runbook.md) — ArgoCD
# can't do that part for you.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vault
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  source:
    repoURL: https://github.com/YoussefAchraf/training-platform-gitops.git
    targetRevision: main
    path: charts/vault
    helm:
      valueFiles:
        - ../../environments/local-okd/vault-values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: vault
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
  # vault-agent-injector patches its own MutatingWebhookConfiguration with
  # a self-generated CA cert at startup (confirmed live: git's manifest -
  # and the last-applied-configuration annotation reflecting it - has
  # caBundle: "", the live object has a real ~2.3KB cert). Permanent,
  # expected drift with no functional difference to ignore, not a
  # transient timing issue - without this, ArgoCD reports this
  # Application OutOfSync forever.
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      name: vault-agent-injector-cfg
      jsonPointers:
        - /webhooks/0/clientConfig/caBundle
