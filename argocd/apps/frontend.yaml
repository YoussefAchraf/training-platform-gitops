apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: frontend
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://github.com/YoussefAchraf/training-platform-gitops.git
    targetRevision: main
    path: charts/frontend
    helm:
      valueFiles:
        - ../../environments/local-okd/frontend-values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: training-platform
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      # Prune the old Deployment only after the new Rollout is Healthy, so the
      # Deployment -> Rollout conversion never leaves the Route without a pod.
      - PruneLast=true
      # Honour ignoreDifferences when applying, not only when diffing, so a sync
      # never resets replicas that KEDA / the Rollout controller manage.
      - RespectIgnoreDifferences=true
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
    - group: argoproj.io
      kind: Rollout
      jsonPointers:
        - /spec/replicas
    # The Rollout controller owns the selector of the active and preview
    # Services (it adds rollouts-pod-template-hash); Git must not revert it.
    - kind: Service
      jsonPointers:
        - /spec/selector
