# Awake Monday-Friday, asleep evenings and weekends (same schedule kube-green had).
# The data stores wake 10 minutes before the apps and sleep 10 minutes after
# them, so nothing ever starts before or outlives what it depends on.
timezone: Europe/Paris
days: "1-5"

workloads:
  # data stores: awake 07:50 - 20:10
  - name: postgres
    kind: StatefulSet
    start: "07:50"
    end: "20:10"
    replicas: 1
  - name: backend-redis
    kind: StatefulSet
    start: "07:50"
    end: "20:10"
    replicas: 1
  - name: chatbot-redis
    kind: StatefulSet
    start: "07:50"
    end: "20:10"
    replicas: 1

  # applications: awake 08:00 - 20:00
  - name: backend
    kind: Rollout
    apiVersion: argoproj.io/v1alpha1
    start: "08:00"
    end: "20:00"
    replicas: 1
  - name: n8n
    kind: Deployment
    start: "08:00"
    end: "20:00"
    replicas: 1
  - name: metrics-exporter
    kind: Deployment
    start: "08:00"
    end: "20:00"
    replicas: 1

  # frontend: blue/green Rollout, two replicas behind the router (load balancing)
  - name: frontend
    kind: Rollout
    apiVersion: argoproj.io/v1alpha1
    start: "08:00"
    end: "20:00"
    replicas: 2
