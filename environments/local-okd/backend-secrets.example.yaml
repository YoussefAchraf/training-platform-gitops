# NOT applied by Helm/ArgoCD — copy-paste template. Real Secret created
# out-of-band; *-secrets.yaml is gitignored, never committed.
#
# DATABASE_URL/REDIS_URL must be full connection strings — the backend app
# reads these directly, it never reads raw postgres-password/redis-password
# itself (confirmed against training-platform-backend's source, see
# CHANGES-PLAN.md). The password inside REDIS_URL must be identical to the
# REDIS_PASSWORD key below — that's what charts/backend's own
# redis-statefulset.yaml actually enforces via --requirepass.
#
#   oc create secret generic backend-credentials \
#     --namespace training-platform \
#     --from-literal=DATABASE_URL='postgresql://postgres:<postgres-password from postgres-secrets.example.yaml>@postgres:5432/training_platform' \
#     --from-literal=REDIS_URL='redis://:<pick-a-redis-password>@backend-redis:6379' \
#     --from-literal=REDIS_PASSWORD='<the same pick-a-redis-password as above>' \
#     --from-literal=JWT_SECRET='<generate: openssl rand -hex 32>' \
#     --from-literal=SMTP_USER='<smtp user>' \
#     --from-literal=SMTP_PASS='<smtp password>' \
#     --from-literal=VAPID_PRIVATE_KEY='<generate: npx web-push generate-vapid-keys>'
#
# Keys expected by charts/backend: DATABASE_URL, REDIS_URL, REDIS_PASSWORD,
# JWT_SECRET, SMTP_USER, SMTP_PASS, VAPID_PRIVATE_KEY
