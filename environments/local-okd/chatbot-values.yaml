# Non-secret overrides for this environment only. All secrets are
# delivered by Vault (vault.enabled: true below) — see
# docs/secrets-inventory.md and docs/runbook.md. chatbot-secrets.example.yaml
# still exists as a bootstrap/disaster-recovery fallback only — not the
# normal path.
n8n:
  image:
    # sha-3b74f6d = last successful docker-publish-n8n.yml run
    # (2026-08-11T11:53:21Z) — confirmed pullable via `docker manifest
    # inspect` 2026-08-11.
    tag: "sha-3b74f6d"
  route:
    host: "n8n-training-platform.apps-crc.testing"   # replace with your local OKD's real Route subdomain
  env:
    N8N_WEBHOOK_URL: "https://n8n-training-platform.apps-crc.testing/"   # must match n8n.route.host above, trailing slash required
    N8N_OWNER_EMAIL: "admin@localhost.local"          # change before exposing this instance beyond your own machine
  persistence:
    storageClassName: ""   # set after `oc get storageclass`

redis:
  persistence:
    storageClassName: ""

metricsExporter:
  image:
    # sha-3ce4829 = last successful docker-publish.yml run
    # (2026-08-11T14:01:36Z) — includes the Vault-env-sourcing fix
    # (chatbot-n8n PR #7/#8). Confirmed pullable 2026-08-11.
    tag: "sha-3ce4829"

vault:
  enabled: true   # Vault (charts/vault) must be deployed and n8n-role configured BEFORE this app syncs — see docs/runbook.md, Vault now comes before chatbot in the build order
