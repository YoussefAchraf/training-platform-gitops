image:
  # Built 2026-08-11 with --build-arg VITE_API_URL/VITE_CHATBOT_WEBHOOK_URL/
  # VITE_VAPID_PUBLIC_KEY pointed at this environment's real Route hosts
  # (below), then pushed to ghcr.io/youssefachraf/training-platform-frontend.
  # Must be rebuilt again (see docs/runbook.md §5) if either Route host ever
  # changes — this chart cannot fix that at deploy time, the build-arg
  # values are baked into the JS bundle at image build time.
  tag: "local-okd"

route:
  host: "training-platform.apps-crc.testing"   # replace with your local OKD's real Route subdomain

env:
  API_ORIGIN: "https://api-training-platform.apps-crc.testing"     # must match backend-values.yaml's route.host
  CHATBOT_ORIGIN: "https://n8n-training-platform.apps-crc.testing" # must match chatbot-values.yaml's n8n.route.host
