# Non-secret overrides for this environment only.
persistence:
  storageClassName: ""   # set after `oc get storageclass` on your local OKD install

# Real password now comes from Vault (training-platform/data/postgres,
# kept in sync with backend's own copy by scripts/vault-bootstrap-secrets.js
# - see docs/secrets-inventory.md) instead of a separately-set Secret -
# postgres now depends on Vault being Healthy first, same as backend/
# chatbot (see argocd/apps/postgres.yaml's sync-wave comment).
# postgres-credentials / postgres-secrets.example.yaml remain only as the
# vault.enabled: false disaster-recovery fallback, same pattern as
# backend/chatbot-values.yaml.
vault:
  enabled: true
