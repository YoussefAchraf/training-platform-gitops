# Extends gitleaks' built-in default ruleset - do NOT remove [extend]:
# a custom .gitleaks.toml with no [extend] table replaces the defaults
# entirely instead of adding to them, which would silently disable every
# built-in detection rule repo-wide, not just narrow one file out of one
# rule (confirmed against gitleaks' own README "Configuration" section -
# behavior since v8.25.0).
[extend]
useDefault = true

# environments/local-okd/app-secrets.sops.env is SOPS+age ciphertext, not
# a leaked secret - every value is individually encrypted (ENC[...]
# blocks) and unreadable without the age private key, which never leaves
# this machine and is never committed (see .gitignore). Ciphertext is
# high-entropy by construction, which is exactly what gitleaks' generic
# API key / entropy rules are built to flag - scoped to this one file's
# path, globally (every rule, not one rule ID), rather than disabling or
# re-tuning individual rules, because the reason it's safe (it's
# ciphertext) doesn't depend on which rule matched it. Same "fix it so it
# can't go stale" philosophy as the sca job's gosu skip-files exclusion
# (.github/workflows/verify.yml).
[[allowlists]]
description = "SOPS+age encrypted secrets file — ciphertext, not a plaintext secret leak"
paths = ['''^environments/local-okd/app-secrets\.sops\.env$''']
