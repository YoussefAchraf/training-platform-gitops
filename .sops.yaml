# SOPS encryption config - auto-selects the age recipient(s) for
# environments/local-okd/app-secrets.sops.env so `sops -e`/`sops <file>`
# never need --age on the command line. Two age keys, not per-developer
# key rotation - this is still a single-developer local lab (same
# reasoning as charts/vault using file storage, not raft: no multi-node
# HA need to justify the complexity), just two independent BACKUPS of
# the ability to decrypt, so no single lost/inaccessible key destroys
# access to this file.
#
# path_regex is matched relative to THIS file's own directory (repo
# root), not CWD and not an absolute path - this file must stay at repo
# root, and the regex must not have a leading "./", or sops reports
# "no matching creation rules found" (confirmed getsops/sops#480).
#
# Neither public key below is secret - that's the point of asymmetric
# encryption. Two independent recipients, not one, so losing either
# key's backup alone isn't fatal (the file stays decryptable by
# whichever one survives):
#   - primary: %AppData%\sops\age\keys.txt on Windows - never
#     committed, see .gitignore. Generate a new one with:
#       age-keygen -o "$env:AppData\sops\age\keys.txt"
#   - backup: a second, independent keypair whose private half is kept
#     somewhere deliberately different from the primary (a different
#     account/service, or printed) - the whole point is the two
#     backups don't share a failure mode. After adding a key here, run
#     `sops updatekeys environments/local-okd/app-secrets.sops.env` to
#     re-wrap the file for the new recipient list.
creation_rules:
  - path_regex: environments[/\\]local-okd[/\\]app-secrets\.sops\.env$
    age: >-
      age1et7ea8qwhfpazhyt8fsxgphyv0mxjr4zqn3jthh5rph2rgzw6y6spv2ujf,
      age1yh5hzqdea529x2fxdgnf64hx70v0f6u5adx3f36r7za20l5xku4sdqekj5
