# node-exporter's DaemonSet (kube-prometheus-stack's
# prometheus-node-exporter subchart) sets hostNetwork: true, hostPID: true,
# and mounts /proc, /sys, and the host root filesystem read-only - real
# node-level visibility a pod can't get any other way. OKD's default
# restricted-v2 SCC rejects all of that outright, so this grant is
# required, not optional. Kept here as a git-tracked resource (rather
# than a manual `oc adm policy add-scc-to-user` runbook step) so this
# Application can auto-sync like every other one in this repo - see
# argocd/apps/monitoring.yaml.
#
# A namespace-scoped RoleBinding (not a ClusterRoleBinding) is
# deliberate: this only needs to apply within the `monitoring` namespace,
# not cluster-wide. `system:openshift:scc:hostaccess` is one of OKD's
# built-in auto-generated ClusterRoles - one exists for every SCC,
# built-in or custom.
#
# ServiceAccount name verified against the actual rendered chart
# (`helm template` with this repo's own values), not assumed - it's
# prefixed with the Helm release name ("monitoring"), which the previous
# runbook.md manual command got wrong (used "prometheus-node-exporter"
# without the prefix).
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-prometheus-node-exporter-scc
  namespace: {{ .Release.Namespace }}
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-prometheus-node-exporter
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: system:openshift:scc:hostaccess
  apiGroup: rbac.authorization.k8s.io
