# Custom dashboard, not one of kube-prometheus-stack's bundled defaults -
# those are all resource-usage graphs (CPU/memory over time), none of them
# is a simple "is this pod actually healthy right now" status view. This
# recreates that view (phase, ready containers, restart count per pod -
# effectively `oc get pods` as a Grafana table) from metrics kube-state-
# metrics already scrapes but nothing surfaces by default.
#
# Picked up automatically by Grafana's dashboard sidecar - any ConfigMap
# labeled grafana_dashboard: "1" in this namespace gets loaded, same
# mechanism kube-prometheus-stack's own bundled dashboards use (see
# charts/monitoring/values.yaml's sidecar.dashboards config).
apiVersion: v1
kind: ConfigMap
metadata:
  name: pod-health-overview-dashboard
  labels:
    grafana_dashboard: "1"
data:
  pod-health-overview.json: |
    {
      "title": "Pod Health Overview",
      "uid": "pod-health-overview",
      "editable": true,
      "schemaVersion": 39,
      "version": 1,
      "tags": ["training-platform"],
      "time": { "from": "now-6h", "to": "now" },
      "refresh": "30s",
      "templating": {
        "list": [
          {
            "name": "namespace",
            "type": "query",
            "datasource": { "type": "prometheus", "uid": "prometheus" },
            "query": "label_values(kube_pod_info, namespace)",
            "current": { "text": "training-platform", "value": "training-platform" },
            "refresh": 2,
            "includeAll": true,
            "multi": true
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Total Pods",
          "gridPos": { "h": 4, "w": 6, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "count(kube_pod_status_phase{namespace=~\"$namespace\"} == 1)", "instant": true, "refId": "A" }
          ]
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Running",
          "gridPos": { "h": 4, "w": 6, "x": 6, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "color": { "mode": "fixed", "fixedColor": "green" } } },
          "targets": [
            { "expr": "count(kube_pod_status_phase{namespace=~\"$namespace\", phase=\"Running\"} == 1) or vector(0)", "instant": true, "refId": "A" }
          ]
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Not Running (Pending/Failed/Unknown)",
          "gridPos": { "h": 4, "w": 6, "x": 12, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "color": { "mode": "fixed", "fixedColor": "red" } } },
          "targets": [
            { "expr": "count(kube_pod_status_phase{namespace=~\"$namespace\", phase!=\"Running\", phase!=\"Succeeded\"} == 1) or vector(0)", "instant": true, "refId": "A" }
          ]
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Total Container Restarts",
          "gridPos": { "h": 4, "w": 6, "x": 18, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "thresholds": { "steps": [ { "color": "green", "value": null }, { "color": "orange", "value": 1 }, { "color": "red", "value": 5 } ] } } },
          "targets": [
            { "expr": "sum(kube_pod_container_status_restarts_total{namespace=~\"$namespace\"}) or vector(0)", "instant": true, "refId": "A" }
          ]
        },
        {
          "id": 5,
          "type": "table",
          "title": "Pod Phase (Running / Pending / Failed / Unknown)",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 4 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "kube_pod_status_phase{namespace=~\"$namespace\"} == 1", "instant": true, "format": "table", "refId": "A" }
          ],
          "transformations": [
            { "id": "organize", "options": { "excludeByName": { "Time": true, "Value": true, "__name__": true, "uid": true }, "indexByName": {}, "renameByName": { "pod": "Pod", "namespace": "Namespace", "phase": "Phase" } } }
          ]
        },
        {
          "id": 6,
          "type": "table",
          "title": "Container Restart Counts",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 4 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "kube_pod_container_status_restarts_total{namespace=~\"$namespace\"}", "instant": true, "format": "table", "refId": "A" }
          ],
          "transformations": [
            { "id": "organize", "options": { "excludeByName": { "Time": true, "__name__": true, "uid": true, "container_id": true }, "indexByName": {}, "renameByName": { "pod": "Pod", "namespace": "Namespace", "container": "Container", "Value": "Restarts" } } },
            { "id": "sortBy", "options": { "fields": {}, "sort": [ { "field": "Restarts", "desc": true } ] } }
          ]
        },
        {
          "id": 7,
          "type": "table",
          "title": "Container Ready Status",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 12 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "kube_pod_container_status_ready{namespace=~\"$namespace\"}", "instant": true, "format": "table", "refId": "A" }
          ],
          "transformations": [
            { "id": "organize", "options": { "excludeByName": { "Time": true, "__name__": true, "uid": true, "container_id": true }, "indexByName": {}, "renameByName": { "pod": "Pod", "namespace": "Namespace", "container": "Container", "Value": "Ready (1=yes, 0=no)" } } }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "cellOptions": { "type": "color-background" }
              },
              "thresholds": { "steps": [ { "color": "red", "value": null }, { "color": "green", "value": 1 } ] }
            }
          }
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "CPU Usage Over Time (cores)",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 20 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "sum by (pod) (node_namespace_pod_container:container_cpu_usage_seconds_total:sum_irate{namespace=~\"$namespace\"})", "legendFormat": "{{`{{pod}}`}}", "refId": "A" }
          ]
        },
        {
          "id": 9,
          "type": "timeseries",
          "title": "Memory Usage Over Time",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 20 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "bytes" } },
          "targets": [
            { "expr": "sum by (pod) (node_namespace_pod_container:container_memory_working_set_bytes{namespace=~\"$namespace\"})", "legendFormat": "{{`{{pod}}`}}", "refId": "A" }
          ]
        },
        {
          "id": 10,
          "type": "bargauge",
          "title": "Current CPU Usage by Pod (cores)",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 28 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] } },
          "targets": [
            { "expr": "sum by (pod) (node_namespace_pod_container:container_cpu_usage_seconds_total:sum_irate{namespace=~\"$namespace\"})", "legendFormat": "{{`{{pod}}`}}", "instant": true, "refId": "A" }
          ]
        },
        {
          "id": 11,
          "type": "bargauge",
          "title": "Current Memory Usage by Pod",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 28 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "bytes" } },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] } },
          "targets": [
            { "expr": "sum by (pod) (node_namespace_pod_container:container_memory_working_set_bytes{namespace=~\"$namespace\"})", "legendFormat": "{{`{{pod}}`}}", "instant": true, "refId": "A" }
          ]
        },
        {
          "id": 12,
          "type": "bargauge",
          "title": "CPU % of Limit by Pod",
          "description": "Usage as a percentage of each pod's own CPU limit. A pod with no CPU limit set won't appear here (no denominator to divide by, not an error). For a multi-container pod where only some containers have a limit set, this ratio can read inflated, since usage sums across all containers but the denominator only sums containers that have a limit.",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 36 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "percent", "thresholds": { "steps": [ { "color": "green", "value": null }, { "color": "orange", "value": 70 }, { "color": "red", "value": 90 } ] } } },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] } },
          "targets": [
            { "expr": "sum by (pod) (node_namespace_pod_container:container_cpu_usage_seconds_total:sum_irate{namespace=~\"$namespace\"}) / sum by (pod) (kube_pod_container_resource_limits{namespace=~\"$namespace\", resource=\"cpu\"}) * 100", "legendFormat": "{{`{{pod}}`}}", "instant": true, "refId": "A" }
          ]
        },
        {
          "id": 13,
          "type": "bargauge",
          "title": "Memory % of Limit by Pod",
          "description": "Usage as a percentage of each pod's own memory limit. A pod with no memory limit set won't appear here (no denominator to divide by, not an error). For a multi-container pod where only some containers have a limit set, this ratio can read inflated, since usage sums across all containers but the denominator only sums containers that have a limit.",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 36 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "percent", "thresholds": { "steps": [ { "color": "green", "value": null }, { "color": "orange", "value": 70 }, { "color": "red", "value": 90 } ] } } },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] } },
          "targets": [
            { "expr": "sum by (pod) (node_namespace_pod_container:container_memory_working_set_bytes{namespace=~\"$namespace\"}) / sum by (pod) (kube_pod_container_resource_limits{namespace=~\"$namespace\", resource=\"memory\"}) * 100", "legendFormat": "{{`{{pod}}`}}", "instant": true, "refId": "A" }
          ]
        }
      ]
    }
