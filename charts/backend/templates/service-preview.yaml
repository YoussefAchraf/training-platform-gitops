{{- if .Values.rollout.enabled }}
# Points at the new (green) ReplicaSet while a release waits for promotion.
# ClusterIP only: reach it with `oc port-forward svc/backend-preview 4001:4000`.
apiVersion: v1
kind: Service
metadata:
  name: backend-preview
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: training-platform
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: backend
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
{{- end }}
