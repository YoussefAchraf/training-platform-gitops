apiVersion: batch/v1
kind: Job
metadata:
  name: backend-migrate-{{ .Release.Revision }}
  labels:
    app.kubernetes.io/name: backend-migrate
    app.kubernetes.io/part-of: training-platform
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend-migrate
      {{- if .Values.vault.enabled }}
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/agent-set-security-context: "false"
        vault.hashicorp.com/agent-pre-populate-only: "true"
        vault.hashicorp.com/role: {{ .Values.vault.role | quote }}
        vault.hashicorp.com/agent-inject-secret-env: {{ .Values.vault.secretPath | quote }}
        vault.hashicorp.com/agent-inject-template-env: |
          {{`{{- with secret "`}}{{ .Values.vault.secretPath }}{{`" -}}`}}
          DATABASE_URL=postgresql://postgres:{{`{{ .Data.data.postgres_password }}`}}@postgres:5432/{{ .Values.postgresDb | default "training_platform" }}
          {{`{{- end -}}`}}
        vault.hashicorp.com/agent-init-requests-cpu: {{ .Values.migration.vaultAgentResources.requests.cpu | quote }}
        vault.hashicorp.com/agent-init-requests-mem: {{ .Values.migration.vaultAgentResources.requests.memory | quote }}
        vault.hashicorp.com/agent-init-limits-cpu: {{ .Values.migration.vaultAgentResources.limits.cpu | quote }}
        vault.hashicorp.com/agent-init-limits-mem: {{ .Values.migration.vaultAgentResources.limits.memory | quote }}
      {{- end }}
    spec:
      restartPolicy: Never
      {{- if .Values.vault.enabled }}
      serviceAccountName: backend
      {{- end }}
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      containers:
        - name: migrate
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          {{- if .Values.vault.enabled }}
          command:
            - sh
            - -c
            - set -a && source /vault/secrets/env && set +a && exec {{ .Values.migration.command | join " " }}
          {{- else }}
          command: {{ .Values.migration.command | toJson }}
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecretName }}
                  key: DATABASE_URL
          {{- end }}
          resources:
            {{- toYaml .Values.migration.resources | nindent 12 }}
