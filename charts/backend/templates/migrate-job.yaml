# Mirrors docker-compose's `migrate` one-shot service exactly (same image,
# same command: node dist/infrastructure/database/migrate.js) — runs
# schema.sql via migrate.ts before the Deployment's new pods roll out.
apiVersion: batch/v1
kind: Job
metadata:
  name: backend-migrate-{{ .Release.Revision }}
  labels:
    app.kubernetes.io/name: backend-migrate
    app.kubernetes.io/part-of: training-platform
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend-migrate
      {{- if .Values.vault.enabled }}
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/agent-set-security-context: "false"
        # Without this, the injected sidecar stays alive after the main
        # container exits and the Job never completes — real finding from
        # an actual OKD deploy (backend-migrate hit BackoffLimitExceeded
        # with zero DATABASE_URL source at all, since this whole
        # annotations block didn't exist yet).
        vault.hashicorp.com/agent-pre-populate-only: "true"
        vault.hashicorp.com/role: {{ .Values.vault.role | quote }}
        vault.hashicorp.com/agent-inject-secret-env: {{ .Values.vault.secretPath | quote }}
        vault.hashicorp.com/agent-inject-template-env: |
          {{`{{- with secret "`}}{{ .Values.vault.secretPath }}{{`" -}}`}}
          DATABASE_URL=postgresql://postgres:{{`{{ .Data.data.postgres_password }}`}}@postgres:5432/{{ .Values.postgresDb | default "training_platform" }}
          {{`{{- end -}}`}}
      {{- end }}
    spec:
      restartPolicy: Never
      {{- if .Values.vault.enabled }}
      # Must match the Deployment's own ServiceAccount — backend-role in
      # Vault is bound to the "backend" SA specifically, not "default".
      # Real finding from an actual OKD deploy: without this, the Vault
      # Agent init container gets "403: service account name not
      # authorized" forever, since it authenticates as "default".
      serviceAccountName: backend
      {{- end }}
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      containers:
        - name: migrate
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          {{- if .Values.vault.enabled }}
          # Vault Agent writes DATABASE_URL to a FILE (/vault/secrets/env),
          # not a process env var — same class of gap metrics-exporter had
          # in the chatbot-n8n repo. `set -a` is required, not optional:
          # plain `source file` only sets shell-local variables, not
          # environment variables, so the exec'd child never actually
          # inherits them without it (confirmed the hard way on a live
          # cluster — DATABASE_URL was silently undefined the whole time
          # without this).
          command:
            - sh
            - -c
            - set -a && source /vault/secrets/env && set +a && exec {{ .Values.migration.command | join " " }}
          {{- else }}
          command: {{ .Values.migration.command | toJson }}
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecretName }}
                  key: DATABASE_URL
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
