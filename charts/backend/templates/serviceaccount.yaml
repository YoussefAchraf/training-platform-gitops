# Dedicated ServiceAccount so a Vault k8s-auth role (see ARCHITECTURE-PLAN.md
# §5) can be bound to this app only, not a shared default SA.
#
# Also a Helm hook (weight -1, before migrate-job's weight 0) — real
# finding from an actual OKD deploy: without this, on a first install the
# migrate-job pre-install hook runs before this ServiceAccount exists at
# all ("serviceaccount \"backend\" not found"), since Helm hooks run
# before the chart's normal (non-hook) resources, and this SA is what the
# migrate Job's serviceAccountName now points at for Vault auth.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backend
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: training-platform
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-1"
