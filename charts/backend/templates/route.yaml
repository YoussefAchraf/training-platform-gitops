# OKD Route, not an Ingress — ARCHITECTURE-PLAN.md §4. Exposed externally
# because the frontend's browser-side API calls hit this directly
# (VITE_API_URL), not proxied through the frontend pod.
{{- if .Values.route.host }}
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: backend
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: training-platform
spec:
  host: {{ .Values.route.host }}
  to:
    kind: Service
    name: backend
  port:
    targetPort: http
  tls:
    termination: {{ .Values.route.tlsTermination }}
    insecureEdgeTerminationPolicy: Redirect
{{- end }}
