image:
  repository: ghcr.io/youssefachraf/training-platform-backend
  tag: ""
  pullPolicy: IfNotPresent

replicaCount: 1

service:
  port: 4000

# Blue/green release with Argo Rollouts. Off by default so the chart renders the plain
# Deployment (Sandbox, or any cluster without the Rollouts CRDs). Turn it on only with a
# backend image that has the cron JobLock, and with env.SOCKET_REDIS_ADAPTER=true: two
# pods are alive at once during a release.
rollout:
  enabled: false
  # false = a person promotes the new version after looking at it.
  autoPromotionEnabled: false
  # How long the previous ReplicaSet is kept after a promotion (instant rollback).
  scaleDownDelaySeconds: 300
  analysis:
    enabled: true
    # Path checked on the preview Service before promotion and on the active one after.
    path: /health

securityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault
containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

env:
  PORT: "4000"
  CLIENT_URL: ""
  TRUST_PROXY: "true"
  JWT_EXPIRES_IN: "8h"
  REFRESH_TOKEN_TTL_DAYS: "30"
  SMTP_HOST: "smtp.gmail.com"
  SMTP_PORT: "587"
  SMTP_FROM: "Training Platform <no-reply@training-platform.com>"
  REPORT_JOB_CRON: "*/10 * * * *"
  REPORT_AUTO_GENERATE_AFTER_MINUTES: "60"
  VAPID_SUBJECT: "mailto:you@yourdomain.com"
  VAPID_PUBLIC_KEY: ""

# Uploaded message attachments (images/voice/files) land on disk at
# /app/storage - a real PVC, not emptyDir, so a redeploy or restart never
# loses them. ReadWriteOnce is fine on a single node (the two pods of a blue/green
# release share it); a multi-node cluster would need ReadWriteMany or pod affinity.
attachments:
  persistence:
    size: 5Gi
    storageClassName: ""

vault:
  enabled: false
  role: backend-role
  secretPath: training-platform/data/backend

secrets:
  existingSecretName: backend-credentials

redis:
  image:
    repository: redis
    tag: "7-alpine"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  persistence:
    size: 1Gi
    storageClassName: ""
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault

migration:
  command: ["node", "dist/infrastructure/database/migrate.js"]
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  vaultAgentResources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
