image:
  repository: ghcr.io/youssefachraf/training-platform-backend
  tag: ""
  pullPolicy: IfNotPresent

replicaCount: 1

service:
  port: 4000

securityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault
containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

env:
  PORT: "4000"
  CLIENT_URL: ""
  TRUST_PROXY: "true"
  JWT_EXPIRES_IN: "8h"
  REFRESH_TOKEN_TTL_DAYS: "30"
  SMTP_HOST: "smtp.gmail.com"
  SMTP_PORT: "587"
  SMTP_FROM: "Training Platform <no-reply@training-platform.com>"
  REPORT_JOB_CRON: "*/10 * * * *"
  REPORT_AUTO_GENERATE_AFTER_MINUTES: "60"
  VAPID_SUBJECT: "mailto:you@yourdomain.com"
  VAPID_PUBLIC_KEY: ""

vault:
  enabled: false
  role: backend-role
  secretPath: training-platform/data/backend

secrets:
  existingSecretName: backend-credentials

redis:
  image:
    repository: redis
    tag: "7-alpine"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  persistence:
    size: 1Gi
    storageClassName: ""
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault

migration:
  command: ["node", "dist/infrastructure/database/migrate.js"]
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  vaultAgentResources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
