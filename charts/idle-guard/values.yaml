# OpenShift's own built-in CLI/toolbox image (ships oc, git, jq, etc.) -
# pulled straight from the cluster's internal registry: no external
# registry dependency, no rate limits, no third-party tag churn to break.
# Confirmed present on the Sandbox via: oc get imagestream tools -n openshift
image:
  repository: image-registry.openshift-image-registry.svc:5000/openshift/tools
  tag: "latest"
  pullPolicy: IfNotPresent

# Every N minutes, check each workload below and scale it back to 1 if the
# Sandbox idler has scaled it to 0. Standard cron syntax.
schedule: "*/10 * * * *"

# Resource names to watch, grouped by kind - must match the actual
# StatefulSet/Deployment names each chart creates.
statefulSets:
  - postgres
  - backend-redis
  - chatbot-redis

deployments:
  - backend
  - frontend
  - n8n

successfulJobsHistoryLimit: 3
failedJobsHistoryLimit: 3

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    cpu: 100m
    memory: 64Mi

securityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault
containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]
