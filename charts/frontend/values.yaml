image:
  repository: ghcr.io/youssefachraf/training-platform-frontend
  tag: ""              # pin a real tag/digest — see the build-arg caveat below before rebuilding
  pullPolicy: IfNotPresent

replicaCount: 1

service:
  port: 8080

route:
  host: ""              # set in environments/local-okd/frontend-values.yaml
  tlsTermination: edge

# nginxinc/nginx-unprivileged already runs as uid 101 / group-writable by
# convention — no fsGroup/chgrp fix needed, unlike backend. ARCHITECTURE-PLAN.md §4.
securityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault
containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi

# Runtime env — NOT the VITE_* build args (those are baked into the JS
# bundle at image build time and cannot be changed here, see the note
# below). These two ARE read at container start by
# docker/docker-entrypoint.sh, which renders them into nginx's
# reverse-proxy config (proxy_pass for /api/ and the chatbot webhook).
# Backend and n8n have no Route of their own — the browser only ever
# calls this frontend's own origin; these must point at their internal
# Service DNS instead.
env:
  BACKEND_UPSTREAM: ""   # e.g. http://backend.training-platform.svc.cluster.local:4000
  CHATBOT_UPSTREAM: ""   # e.g. http://n8n.training-platform.svc.cluster.local:5678

# Reminder, not a chart setting: VITE_API_URL / VITE_CHATBOT_WEBHOOK_URL are
# compiled into the JS bundle at `docker build` time in
# training-platform-frontend, but as same-origin relative paths now (/api,
# /webhook/chatbot/message) — they no longer need to match anything
# environment-specific, so this image doesn't need rebuilding per
# environment the way it used to. Only VITE_VAPID_PUBLIC_KEY still does.
# See ARCHITECTURE-PLAN.md §6 and docs/runbook.md.
