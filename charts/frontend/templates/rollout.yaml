{{- if .Values.rollout.enabled }}
# Blue/green release of the frontend (Argo Rollouts). Same pod template as the
# plain Deployment. The active Service ("frontend", behind the Route) keeps
# pointing at the current ReplicaSet while the new one comes up behind the
# preview Service; the selector is switched only on promotion.
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: frontend
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: training-platform
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
  template:
    {{- include "frontend.podTemplate" . | nindent 4 }}
  strategy:
    blueGreen:
      activeService: frontend
      previewService: frontend-preview
      # false = a person promotes (ArgoCD Rollout action, or
      # `kubectl argo rollouts promote frontend`). The old ReplicaSet stays
      # for scaleDownDelaySeconds after a promotion, so rollback is instant.
      autoPromotionEnabled: {{ .Values.rollout.autoPromotionEnabled }}
      scaleDownDelaySeconds: {{ .Values.rollout.scaleDownDelaySeconds }}
      {{- if .Values.rollout.analysis.enabled }}
      prePromotionAnalysis:
        templates:
          - templateName: frontend-smoke
        args:
          - name: base-url
            value: {{ printf "http://frontend-preview.%s.svc.cluster.local:%v/" .Release.Namespace .Values.service.port | quote }}
      postPromotionAnalysis:
        templates:
          - templateName: frontend-smoke
        args:
          - name: base-url
            value: {{ printf "http://frontend.%s.svc.cluster.local:%v/" .Release.Namespace .Values.service.port | quote }}
      {{- end }}
{{- end }}
