{{- if .Values.rollout.enabled }}
# Points at the new (green) ReplicaSet while a release waits for promotion.
# ClusterIP only: reach it with `oc port-forward svc/frontend-preview 8081:8080`.
apiVersion: v1
kind: Service
metadata:
  name: frontend-preview
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: training-platform
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: frontend
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
{{- end }}
