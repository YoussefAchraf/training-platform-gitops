apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n
  labels:
    app.kubernetes.io/name: n8n
    app.kubernetes.io/part-of: training-platform
spec:
  replicas: 1
  strategy:
    type: Recreate   # single PVC (n8n_data), ReadWriteOnce — a rolling update would deadlock two pods fighting over the same volume
  selector:
    matchLabels:
      app.kubernetes.io/name: n8n
  template:
    metadata:
      labels:
        app.kubernetes.io/name: n8n
        app.kubernetes.io/part-of: training-platform
      {{- if .Values.vault.enabled }}
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/agent-set-security-context: "false"
        vault.hashicorp.com/role: {{ .Values.vault.role | quote }}
        vault.hashicorp.com/agent-inject-secret-env: {{ .Values.vault.secretPath | quote }}
        vault.hashicorp.com/agent-inject-template-env: |
          {{`{{- with secret "`}}{{ .Values.vault.secretPath }}{{`" -}}`}}
          N8N_ENCRYPTION_KEY={{`{{ .Data.data.n8n_encryption_key }}`}}
          N8N_OWNER_PASSWORD={{`{{ .Data.data.n8n_owner_password }}`}}
          AI_API_KEY={{`{{ .Data.data.n8n_ai_api_key }}`}}
          REDIS_PASSWORD={{`{{ .Data.data.redis_password }}`}}
          {{`{{- end -}}`}}
      {{- end }}
    spec:
      # Real finding from an actual OKD deploy: Kubernetes' Docker-links
      # compatibility feature (default-on) injects an env var per Service
      # in the namespace, and since this Service is named "n8n" it injects
      # N8N_PORT=tcp://<cluster-ip>:5678 into this pod — colliding with
      # n8n's own N8N_PORT config var, which expects a bare port number
      # ("Invalid number value for N8N_PORT: tcp://..."). Disabling service
      # links is the standard fix for this well-known n8n-on-Kubernetes
      # footgun.
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        # fsGroup deliberately unset — a hardcoded value (even one matching
        # the image's own uid, 1000) gets rejected by OKD's restricted-v2
        # SCC ("not an allowed group"); confirmed on an actual OKD deploy.
        # Leaving it unset lets OKD auto-assign one from the namespace's
        # allocated range, which still makes the PVC group-writable.
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: n8n
          image: "{{ .Values.n8n.image.repository }}:{{ .Values.n8n.image.tag }}"
          imagePullPolicy: {{ .Values.n8n.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # No command override — the image's own ENTRYPOINT
          # (["sh","/entrypoint.sh"], baked in by training-platform-chatbot-n8n's
          # Dockerfile) already does this, and entrypoint.sh/bootstrap.js/the
          # 5 workflow JSONs are baked into the image itself, not bind-mounted.
          ports:
            - name: http
              containerPort: 5678
          env:
            # Real finding from an actual OKD deploy: OKD runs this
            # container as an arbitrary, non-passwd UID (restricted-v2
            # SCC), so $HOME resolves to "/" instead of the image's node
            # user's home — n8n then tries (and fails, EACCES) to create
            # its settings dir at /.n8n instead of the mounted
            # /home/node/.n8n. Same class of bug as backend's PM2_HOME fix.
            - name: HOME
              value: /home/node
            {{- range $key, $value := .Values.n8n.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            - name: REDIS_HOST
              value: {{ .Values.redis.service.name | quote }}
            - name: REDIS_PORT
              value: {{ .Values.redis.service.port | quote }}
            {{- if not .Values.vault.enabled }}
            - name: N8N_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecretName }}
                  key: N8N_ENCRYPTION_KEY
            - name: N8N_OWNER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecretName }}
                  key: N8N_OWNER_PASSWORD
            - name: AI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecretName }}
                  key: AI_API_KEY
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecretName }}
                  key: REDIS_PASSWORD
            {{- end }}
          volumeMounts:
            - name: n8n-data
              mountPath: /home/node/.n8n
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            {{- toYaml .Values.n8n.resources | nindent 12 }}
      volumes:
        - name: n8n-data
          persistentVolumeClaim:
            claimName: n8n-data
