# Single Route covers both the editor UI and the /webhook/chatbot/message
# path the frontend's chat widget calls directly from the browser — matches
# ARCHITECTURE-PLAN.md §6.
{{- if .Values.n8n.route.host }}
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: n8n
  labels:
    app.kubernetes.io/name: n8n
    app.kubernetes.io/part-of: training-platform
spec:
  host: {{ .Values.n8n.route.host }}
  to:
    kind: Service
    name: n8n
  port:
    targetPort: http
  tls:
    termination: {{ .Values.n8n.route.tlsTermination }}
    insecureEdgeTerminationPolicy: Redirect
{{- end }}
