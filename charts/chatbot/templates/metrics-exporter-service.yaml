{{- if .Values.metricsExporter.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: metrics-exporter
  labels:
    app.kubernetes.io/name: metrics-exporter
    app.kubernetes.io/part-of: training-platform
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: metrics-exporter
  ports:
    - name: metrics
      port: {{ .Values.metricsExporter.service.port }}
      targetPort: metrics
{{- end }}
