  name: n8n
  labels:
    app.kubernetes.io/name: n8n
    app.kubernetes.io/part-of: training-platform
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: n8n
  ports:
    - name: http
      port: {{ .Values.n8n.service.port }}
      targetPort: http
