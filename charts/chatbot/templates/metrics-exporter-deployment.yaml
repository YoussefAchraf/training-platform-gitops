{{- if .Values.metricsExporter.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: metrics-exporter
  labels:
    app.kubernetes.io/name: metrics-exporter
    app.kubernetes.io/part-of: training-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: metrics-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: metrics-exporter
        app.kubernetes.io/part-of: training-platform
      {{- if .Values.vault.enabled }}
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/agent-set-security-context: "false"
        vault.hashicorp.com/role: {{ .Values.vault.role | quote }}
        vault.hashicorp.com/agent-inject-secret-env: {{ .Values.vault.secretPath | quote }}
        vault.hashicorp.com/agent-inject-template-env: |
          {{`{{- with secret "`}}{{ .Values.vault.secretPath }}{{`" -}}`}}
          N8N_OWNER_PASSWORD='{{`{{ .Data.data.n8n_owner_password }}`}}'
          {{`{{- end -}}`}}
      {{- end }}
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: metrics-exporter
          image: "{{ .Values.metricsExporter.image.repository }}:{{ .Values.metricsExporter.image.tag }}"
          imagePullPolicy: {{ .Values.metricsExporter.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: metrics
              containerPort: 9464
          env:
            {{- range $key, $value := .Values.metricsExporter.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            - name: N8N_BASE_URL
              value: "http://n8n:{{ .Values.n8n.service.port }}"
            - name: N8N_OWNER_EMAIL
              value: {{ .Values.n8n.env.N8N_OWNER_EMAIL | quote }}
            {{- if not .Values.vault.enabled }}
            - name: N8N_OWNER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecretName }}
                  key: N8N_OWNER_PASSWORD
            {{- end }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            {{- toYaml .Values.metricsExporter.resources | nindent 12 }}
{{- end }}
