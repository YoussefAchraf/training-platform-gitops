n8n:
  image:
    repository: ghcr.io/youssefachraf/training-platform-chatbot-n8n
    tag: ""
    pullPolicy: IfNotPresent
  service:
    port: 5678
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  persistence:
    size: 2Gi
    storageClassName: ""
  env:
    GENERIC_TIMEZONE: "Africa/Casablanca"
    N8N_WEBHOOK_URL: ""
    N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
    BACKEND_API_URL: "http://backend:4000"
    MCP_SERVER_URL: ""
    AI_BASE_URL: "https://api.openai.com/v1"
    AI_MODEL: "gpt-4o-mini"
    N8N_OWNER_EMAIL: "admin@localhost.local"
    N8N_METRICS: "true"
    N8N_METRICS_INCLUDE_WORKFLOW_ID_LABEL: "true"
    N8N_METRICS_INCLUDE_WORKFLOW_NAME_LABEL: "true"
    N8N_METRICS_INCLUDE_WORKFLOW_STATISTICS: "true"
    N8N_METRICS_INCLUDE_API_ENDPOINTS: "true"
    N8N_METRICS_INCLUDE_API_PATH_LABEL: "true"
    N8N_METRICS_INCLUDE_API_STATUS_CODE_LABEL: "true"
    N8N_METRICS_INCLUDE_CACHE_METRICS: "true"

redis:
  image:
    repository: redis
    tag: "7-alpine"
    pullPolicy: IfNotPresent
  service:
    name: chatbot-redis
    port: 6379
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  persistence:
    size: 1Gi
    storageClassName: ""
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault

metricsExporter:
  enabled: true
  image:
    repository: ghcr.io/youssefachraf/training-platform-chatbot-n8n-metrics-exporter
    tag: ""
    pullPolicy: IfNotPresent
  service:
    port: 9464
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  env:
    EXPORTER_POLL_INTERVAL_SECONDS: "15"
    EXPORTER_PORT: "9464"
    AI_PRICE_PROMPT_PER_1M_USD: "0.10"
    AI_PRICE_COMPLETION_PER_1M_USD: "0.40"
  serviceMonitor:
    enabled: false

vault:
  enabled: false
  role: n8n-role
  secretPath: training-platform/data/n8n

secrets:
  existingSecretName: chatbot-credentials
