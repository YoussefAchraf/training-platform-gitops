# Grants the vault ServiceAccount permission to create and read the
# `vault-init-keys` Secret its own bootstrap sidecar writes on first-ever
# boot and reads on every subsequent unseal. No values-based extension
# point exists for this upstream: `server.serviceAccount` only supports
# `create`/`name`/`annotations`/`extraLabels` (confirmed by rendering the
# pinned chart version directly), nothing for extra RBAC rules. Same
# class of gap charts/monitoring/templates/node-exporter-scc-rolebinding.yaml
# already fills for a different chart - a tiny local template is this
# repo's established pattern for "upstream chart has no hook for this."
#
# get + create only, deliberately never update/patch: the Secret is
# write-once (see charts/vault/values.yaml's vault-bootstrap script -
# it's created exactly once, on first init, and only ever read after
# that). Kubernetes RBAC has no way to scope `create` by resourceName
# (the name doesn't exist yet at creation time), so that verb is
# necessarily namespace-wide for the secrets resource; `get` is scoped
# to this one Secret's name specifically.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: vault-init-secret
  labels:
    app.kubernetes.io/name: vault
    app.kubernetes.io/part-of: training-platform
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["vault-init-keys"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: vault-init-secret
  labels:
    app.kubernetes.io/name: vault
    app.kubernetes.io/part-of: training-platform
subjects:
  - kind: ServiceAccount
    name: {{ .Values.vault.server.serviceAccount.name }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: vault-init-secret
  apiGroup: rbac.authorization.k8s.io
