{{- if .Values.injectorRestart.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: vault-injector-restart
  labels:
    app.kubernetes.io/name: vault-injector-restart
    app.kubernetes.io/part-of: training-platform
spec:
  schedule: {{ .Values.injectorRestart.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: {{ .Values.injectorRestart.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.injectorRestart.failedJobsHistoryLimit }}
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 60
      template:
        metadata:
          labels:
            app.kubernetes.io/name: vault-injector-restart
        spec:
          restartPolicy: Never
          serviceAccountName: vault-injector-restart
          securityContext:
            {{- toYaml .Values.injectorRestart.securityContext | nindent 12 }}
          containers:
            - name: restart
              image: "{{ .Values.injectorRestart.image.repository }}:{{ .Values.injectorRestart.image.tag }}"
              imagePullPolicy: {{ .Values.injectorRestart.image.pullPolicy }}
              securityContext:
                {{- toYaml .Values.injectorRestart.containerSecurityContext | nindent 16 }}
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  echo "Restarting vault-agent-injector to force a fresh serving certificate"
                  # --wait=false: the default delete watches the pod until it's gone,
                  # which needs a "watch" RBAC verb this ServiceAccount doesn't have
                  # (minimal RBAC: get/list/delete only). The Deployment recreates the
                  # pod regardless of whether this job sticks around to see it happen.
                  oc delete pod -n {{ .Release.Namespace }} -l app.kubernetes.io/name=vault-agent-injector --ignore-not-found --wait=false
              resources:
                {{- toYaml .Values.injectorRestart.resources | nindent 16 }}
{{- end }}
