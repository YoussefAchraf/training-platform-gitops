vault:
  server:
    dev:
      enabled: false
    standalone:
      enabled: true
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
    dataStorage:
      enabled: true
      size: 1Gi
    ha:
      enabled: false
    serviceAccount:
      name: vault
    statefulSet:
      securityContext:
        pod:
          runAsNonRoot: true
          runAsGroup: null
          runAsUser: null
          fsGroup: null
        container:
          allowPrivilegeEscalation: false

    extraContainers:
      - name: vault-bootstrap
        image: "hashicorp/vault:1.17.2"
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        volumeMounts:
          - name: data
            mountPath: /vault-init-scratch
            subPath: vault-init-scratch
        command: ["/bin/sh", "-c"]
        args:
          - |
            set -e
            export VAULT_ADDR=http://127.0.0.1:8200

            K8S_API="https://${KUBERNETES_SERVICE_HOST}:${KUBERNETES_SERVICE_PORT}"
            NS="$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace)"
            TOKEN_FILE=/var/run/secrets/kubernetes.io/serviceaccount/token
            SECRET_NAME=vault-init-keys
            SCRATCH=/vault-init-scratch/init-output.json

            k8s_get_secret() {
              wget -q -O- --no-check-certificate \
                --header="Authorization: Bearer $(cat $TOKEN_FILE)" \
                "$K8S_API/api/v1/namespaces/$NS/secrets/$SECRET_NAME" 2>/dev/null | tr -d '[:space:]'
            }

            k8s_create_secret() {
              BODY=$(printf '{"apiVersion":"v1","kind":"Secret","type":"Opaque","metadata":{"name":"%s"},"stringData":{"unseal_key_b64":"%s","root_token":"%s"}}' "$SECRET_NAME" "$1" "$2")
              wget -q -O- --no-check-certificate \
                --header="Authorization: Bearer $(cat $TOKEN_FILE)" \
                --header="Content-Type: application/json" \
                --post-data="$BODY" \
                "$K8S_API/api/v1/namespaces/$NS/secrets" | tr -d '[:space:]'
            }

            echo "[vault-bootstrap] waiting for vault server to respond..."
            STATUS_JSON=""
            until [ -n "$STATUS_JSON" ]; do
              STATUS_JSON=$(vault status -format=json 2>/dev/null | tr -d '[:space:]') || true
              [ -z "$STATUS_JSON" ] && sleep 2
            done

            INITIALIZED=$(echo "$STATUS_JSON" | grep -o '"initialized":[a-z]*' | cut -d: -f2)
            SEALED=$(echo "$STATUS_JSON" | grep -o '"sealed":[a-z]*' | cut -d: -f2)

            if [ "$INITIALIZED" != "true" ]; then
              echo "[vault-bootstrap] vault not initialized yet."

              EXISTING=$(k8s_get_secret) || true
              if echo "$EXISTING" | grep -q '"root_token"'; then
                while true; do
                  echo "[vault-bootstrap] CRITICAL: vault-init-keys Secret already exists but vault reports uninitialized - inconsistent state (PVC wiped independently of the Secret?). Not touching anything automatically; manual investigation required."
                  sleep 300
                done
              fi

              if [ -f "$SCRATCH" ]; then
                echo "[vault-bootstrap] found scratch init-output from an incomplete previous run, retrying the Secret write from it..."
                INIT_JSON=$(cat "$SCRATCH")
              else
                echo "[vault-bootstrap] running vault operator init..."
                INIT_JSON=$(vault operator init -key-shares=1 -key-threshold=1 -format=json)
                INIT_JSON=$(echo "$INIT_JSON" | tr -d '[:space:]')
                echo "$INIT_JSON" > "$SCRATCH"
              fi

              UNSEAL_KEY=$(echo "$INIT_JSON" | grep -o '"unseal_keys_b64":\["[^"]*"' | sed 's/.*\["//; s/"$//')
              ROOT_TOKEN=$(echo "$INIT_JSON" | grep -o '"root_token":"[^"]*"' | cut -d'"' -f4)

              echo "[vault-bootstrap] writing vault-init-keys Secret..."
              CREATE_RESULT=$(k8s_create_secret "$UNSEAL_KEY" "$ROOT_TOKEN") || true
              if ! echo "$CREATE_RESULT" | grep -q '"name":"vault-init-keys"'; then
                echo "[vault-bootstrap] CRITICAL: failed to write vault-init-keys Secret after operator init - init output is still on disk at $SCRATCH, will retry the write on next restart. Response: $CREATE_RESULT"
                exit 1
              fi
              rm -f "$SCRATCH"
              echo "[vault-bootstrap] init complete."

              STATUS_JSON=$(vault status -format=json 2>/dev/null | tr -d '[:space:]' || true)
              SEALED=$(echo "$STATUS_JSON" | grep -o '"sealed":[a-z]*' | cut -d: -f2)
            fi

            if [ "$SEALED" = "true" ]; then
              echo "[vault-bootstrap] vault is sealed, unsealing..."
              SECRET_JSON=$(k8s_get_secret) || true
              if ! echo "$SECRET_JSON" | grep -q '"unseal_key_b64"'; then
                while true; do
                  echo "[vault-bootstrap] CRITICAL: vault is initialized and sealed but no vault-init-keys Secret exists - unseal key not recoverable automatically. Manual intervention required."
                  sleep 300
                done
              fi
              UNSEAL_KEY=$(echo "$SECRET_JSON" | grep -o '"unseal_key_b64":"[^"]*"' | cut -d'"' -f4 | base64 -d)
              vault operator unseal "$UNSEAL_KEY" >/dev/null
              echo "[vault-bootstrap] unsealed."
            fi

            SECRET_JSON=$(k8s_get_secret) || true
            ROOT_TOKEN_B64=$(echo "$SECRET_JSON" | grep -o '"root_token":"[^"]*"' | cut -d'"' -f4)
            if [ -z "$ROOT_TOKEN_B64" ]; then
              echo "[vault-bootstrap] CRITICAL: could not read root_token from vault-init-keys Secret - cannot proceed with auth bootstrap."
              exit 1
            fi
            export VAULT_TOKEN=$(echo "$ROOT_TOKEN_B64" | base64 -d)

            if vault auth list -format=json 2>/dev/null | grep -q '"kubernetes/"'; then
              echo "[vault-bootstrap] kubernetes auth already configured, nothing to do."
            else
              echo "[vault-bootstrap] configuring kubernetes auth, KV mount, policies, roles..."

              vault auth enable kubernetes

              vault write auth/kubernetes/config \
                kubernetes_host="https://${KUBERNETES_SERVICE_HOST}:${KUBERNETES_SERVICE_PORT}" \
                kubernetes_ca_cert=@/var/run/secrets/kubernetes.io/serviceaccount/ca.crt \
                token_reviewer_jwt=@/var/run/secrets/kubernetes.io/serviceaccount/token

              vault secrets enable -path=training-platform -version=2 kv || true

              printf 'path "training-platform/data/backend" {\n  capabilities = ["read"]\n}\n' | vault policy write backend-policy -

              printf 'path "training-platform/data/n8n" {\n  capabilities = ["read"]\n}\n' | vault policy write n8n-policy -

              printf 'path "training-platform/data/postgres" {\n  capabilities = ["read"]\n}\n' | vault policy write postgres-policy -

              vault write auth/kubernetes/role/backend-role \
                bound_service_account_names=backend \
                bound_service_account_namespaces=training-platform \
                policies=backend-policy \
                ttl=3600

              vault write auth/kubernetes/role/n8n-role \
                bound_service_account_names=default \
                bound_service_account_namespaces=training-platform \
                policies=n8n-policy \
                ttl=3600

              vault write auth/kubernetes/role/postgres-role \
                bound_service_account_names=postgres \
                bound_service_account_namespaces=training-platform \
                policies=postgres-policy \
                ttl=3600

              echo "[vault-bootstrap] done."
              echo "[vault-bootstrap] REMINDER: run 'node scripts/vault-bootstrap-secrets.js' now to get real secret values in - this sidecar only rebuilds structure, never secret data. Get VAULT_TOKEN from: oc get secret vault-init-keys -n vault -o jsonpath='{.data.root_token}' | base64 -d"
            fi

            if vault audit list -format=json 2>/dev/null | tr -d '[:space:]' | grep -q '"file/"'; then
              echo "[vault-bootstrap] file audit device already enabled, nothing to do."
            else
              echo "[vault-bootstrap] enabling file audit device..."
              vault audit enable file file_path=/vault/data/vault-audit.log
              echo "[vault-bootstrap] audit logging enabled -> /vault/data/vault-audit.log"
            fi

            sleep infinity

  injector:
    enabled: true
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi
    securityContext:
      pod:
        runAsNonRoot: true
        runAsGroup: null
        runAsUser: null
        fsGroup: null
      container:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]

  ui:
    enabled: true
    serviceType: ClusterIP
