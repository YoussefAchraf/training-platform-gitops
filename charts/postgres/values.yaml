image:
  repository: postgres
  tag: "16-alpine"
  pullPolicy: IfNotPresent

replicaCount: 1

service:
  port: 5432

# postgres:16-alpine writes its data directory as a hardcoded UID and will
# crash-loop under OKD's restricted-v2 SCC without fsGroup making the
# mounted volume group-writable. Real finding from an actual OKD deploy:
# fsGroup must be LEFT UNSET, not hardcoded — restricted-v2 validates it
# against the namespace's allocated supplemental-groups range (e.g.
# 1000650000-1000659999, `oc get namespace <ns> -o yaml` shows the exact
# range), same as runAsUser. A hardcoded value like 999 is rejected
# ("999 is not an allowed group") exactly like a hardcoded runAsUser is —
# leaving it unset lets OKD auto-assign a valid one, same mechanism.
securityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault   # required by the Restricted Pod Security Standard (and OKD's restricted-v2 SCC) — without this, kube-apiserver silently rejects the pod under enforce mode; confirmed via a live kind-cluster deploy under PSA "restricted" (dast.yml)
containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

persistence:
  size: 5Gi
  storageClassName: ""   # set in environments/local-okd/postgres-values.yaml once `oc get storageclass` is confirmed

# Non-secret. POSTGRES_PASSWORD is injected via the Secret named below —
# never a plaintext value.env: {} — see docs/secrets-inventory.md.
postgresDb: training_platform
postgresUser: postgres

# Name of the Secret (created out-of-band for now, replaced by Vault-derived
# secrets in a later phase per ARCHITECTURE-PLAN.md §5) holding key
# `postgres-password`.
existingSecret: postgres-credentials
