# Dedicated ServiceAccount, not `default` - postgres-role in Vault is bound
# to this SA specifically (same reasoning as backend's own ServiceAccount:
# a role bound to `default` would let *any* pod using `default` in this
# namespace authenticate as it, defeating the point of a scoped policy).
# Only created when vault.enabled, since it exists solely for that.
{{- if .Values.vault.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: training-platform
{{- end }}
