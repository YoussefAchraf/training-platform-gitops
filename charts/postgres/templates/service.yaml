# Internal-only, matches ARCHITECTURE-PLAN.md §6: reached exclusively via
# ClusterIP Service DNS (postgres:5432) from the backend, never externally.
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: training-platform
spec:
  type: ClusterIP
  clusterIP: None   # headless, matches the StatefulSet's serviceName
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: {{ .Values.service.port }}
      targetPort: postgres
